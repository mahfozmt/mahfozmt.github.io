<section class="section" id="experience" [attr.aria-labelledby]="heading.headingId">
  <div class="container">
    <app-section-header [heading]="heading" />

    <div class="timeline-container">
      <!-- Animated Vertical Timeline Rail -->
      <svg class="git-rail-svg" viewBox="0 0 16 600" preserveAspectRatio="none" aria-hidden="true">
        <line
          x1="8"
          y1="0"
          x2="8"
          y2="600"
          stroke="rgba(56, 189, 248, 0.22)"
          stroke-width="2"
          stroke-dasharray="4 4"
        />
        <line
          class="git-rail-pulse"
          x1="8"
          y1="0"
          x2="8"
          y2="600"
          stroke="var(--primary)"
          stroke-width="2.5"
          stroke-dasharray="60 280"
        />
      </svg>

      @for (entry of entries; track entry.id) {
        <div
          class="timeline-item"
          [class.current]="entry.current"
          [attr.data-card-theme]="entry.id"
        >
          <div class="timeline-marker"></div>
          <div class="timeline-card">
            <div class="timeline-top">
              <div class="role-header-group">
                @if (entry.logoUrl) {
                  <div class="exp-brand-badge">
                    <img
                      [src]="entry.logoUrl"
                      [alt]="entry.logoAlt || entry.company + ' logo'"
                      class="exp-logo-img"
                      loading="lazy"
                      decoding="async"
                    />
                  </div>
                }
                <div class="role-meta-group">
                  <div class="role-title">{{ entry.title }}</div>
                  <div class="company-name">
                    {{ entry.company }}
                    @if (entry.employmentType) {
                      · {{ entry.employmentType }}
                    }
                  </div>
                  @if (entry.sectorTag) {
                    <div class="exp-sector-tag">{{ entry.sectorTag }}</div>
                  }
                </div>
              </div>
              <span class="timeline-date">{{ entry.dates }} · {{ entry.location }}</span>
            </div>
            <div class="timeline-body">
              <p [innerHTML]="entry.summaryHtml"></p>
              <app-chip-list [chips]="entry.chips" />
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</section>
