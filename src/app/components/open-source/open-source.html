<section id="open-source" class="section" [attr.aria-labelledby]="heading.headingId">
  <div class="container">
    <app-section-header [heading]="heading" />

    <div class="os-grid">
      @for (project of projects; track project.url) {
        <div class="os-card" [class.featured]="project.featured">
          <div>
            <div class="os-card-header">
              <a [href]="project.url" target="_blank" rel="noopener" class="os-card-title">
                <svg
                  [attr.width]="project.featured ? 22 : 20"
                  [attr.height]="project.featured ? 22 : 20"
                  viewBox="0 0 24 24"
                  fill="currentColor"
                >
                  <path
                    d="M12 .3a12 12 0 0 0-3.8 23.38c.6.12.83-.26.83-.57v-2.04c-3.34.73-4.04-1.61-4.04-1.61-.55-1.39-1.34-1.76-1.34-1.76-1.09-.75.08-.73.08-.73 1.2.08 1.84 1.24 1.84 1.24 1.07 1.83 2.81 1.3 3.5 1 .1-.78.42-1.31.76-1.61-2.67-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.13-.3-.54-1.52.12-3.18 0 0 1-.32 3.3 1.23a11.5 11.5 0 0 1 6 0c2.28-1.55 3.29-1.23 3.29-1.23.66 1.66.25 2.88.12 3.18.77.84 1.24 1.91 1.24 3.22 0 4.61-2.81 5.62-5.48 5.92.43.37.81 1.1.81 2.22v3.29c0 .32.22.69.83.57A12 12 0 0 0 12 .3"
                  />
                </svg>
                <span>{{ project.name }}</span>
                @if (project.featured) {
                  <svg
                    class="os-card-ext"
                    width="14"
                    height="14"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <polyline points="15 3 21 3 21 9" />
                    <line x1="10" y1="14" x2="21" y2="3" />
                  </svg>
                }
              </a>
              @if (project.badge) {
                <span class="badge">{{ project.badge }}</span>
              }
            </div>
            <p class="os-card-desc" [style.margin-top.px]="project.featured ? 12 : 10">
              {{ project.description }}
            </p>
          </div>
          <app-chip-list
            [style.margin-top.px]="project.featured ? 14 : null"
            [chips]="project.chips"
          />
        </div>
      }
    </div>
  </div>
</section>
