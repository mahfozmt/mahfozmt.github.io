<section id="credentials" class="section" [attr.aria-labelledby]="heading.headingId">
  <div class="container">
    <app-section-header [heading]="heading" />

    <div class="creds-grid">
      @for (credential of credentials; track credential.name) {
        <div class="cred-card">
          @if (credential.badge; as badge) {
            @if (badge.href) {
              <a
                class="cred-icon-wrap cred-badge"
                [href]="badge.href"
                target="_blank"
                rel="noopener"
                [attr.aria-label]="badge.linkAriaLabel"
              >
                <img [src]="badge.src" [alt]="badge.alt" width="72" height="72" loading="lazy" />
              </a>
            } @else {
              <div class="cred-icon-wrap cred-badge">
                <img [src]="badge.src" [alt]="badge.alt" width="72" height="72" loading="lazy" />
              </div>
            }
          } @else {
            <div class="cred-icon-wrap">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                @if (credential.icon === 'book') {
                  <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
                  <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
                } @else {
                  <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" />
                  <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" />
                }
              </svg>
            </div>
          }
          <div class="cred-details">
            <div class="cred-name">{{ credential.name }}</div>
            <div class="cred-org">{{ credential.organisation }}</div>
            <div class="cred-desc">
              {{ credential.description }}
              @if (credential.link; as link) {
                ·
                <a class="cred-verify" [href]="link.url" target="_blank" rel="noopener">{{
                  link.label
                }}</a>
              }
            </div>
            <div class="cred-year">{{ credential.year }}</div>
          </div>
        </div>
      }
    </div>
  </div>
</section>
