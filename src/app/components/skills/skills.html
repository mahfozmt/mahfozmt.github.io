<section id="skills" class="section" [attr.aria-labelledby]="heading.headingId">
  <div class="container">
    <app-section-header [heading]="heading" />

    <div class="skills-grid">
      @for (group of groups; track group.id) {
        <div class="skill-card" [class.skill-card-wide]="group.wide">
          <div class="skill-card-head">
            <div class="skill-card-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                @switch (group.icon) {
                  @case ('server') {
                    <rect x="2" y="2" width="20" height="8" rx="2" ry="2" />
                    <rect x="2" y="14" width="20" height="8" rx="2" ry="2" />
                    <line x1="6" y1="6" x2="6.01" y2="6" />
                    <line x1="6" y1="18" x2="6.01" y2="18" />
                  }
                  @case ('layers') {
                    <polygon points="12 2 2 7 12 12 22 7 12 2" />
                    <polyline points="2 17 12 22 22 17" />
                    <polyline points="2 12 12 17 22 12" />
                  }
                  @case ('database') {
                    <ellipse cx="12" cy="5" rx="9" ry="3" />
                    <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3" />
                    <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5" />
                  }
                  @case ('cloud') {
                    <path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z" />
                  }
                  @case ('shield') {
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
                  }
                  @case ('smartphone') {
                    <rect x="5" y="2" width="14" height="20" rx="2" ry="2" />
                    <line x1="12" y1="18" x2="12.01" y2="18" />
                  }
                  @case ('sparkles') {
                    <path d="M12 2l2.4 7.2L22 12l-7.6 2.8L12 22l-2.4-7.2L2 12l7.6-2.8z" />
                  }
                }
              </svg>
            </div>
            <h3 class="skill-card-title">{{ group.title }}</h3>
          </div>
          <app-chip-list [chips]="group.chips" />
        </div>
      }
    </div>
  </div>
</section>
