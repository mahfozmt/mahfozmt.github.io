<div class="arch-head-bar">
  <div class="arch-label">{{ flow().label }}</div>
</div>
<div class="arch-flow">
  @for (node of flow().nodes; track $index; let idx = $index; let last = $last) {
    <span class="arch-node">
      <span class="arch-node-idx" aria-hidden="true">0{{ idx + 1 }}</span>
      <span>{{ node }}</span>
    </span>
    @if (!last) {
      <span class="arch-arrow" aria-hidden="true">
        <svg class="arch-wire-svg" width="28" height="12" viewBox="0 0 28 12">
          <line
            x1="0"
            y1="6"
            x2="22"
            y2="6"
            stroke="var(--card-border, rgba(148, 163, 184, 0.4))"
            stroke-width="1.5"
            stroke-dasharray="3 2"
          />
          <line
            class="wire-pulse"
            x1="0"
            y1="6"
            x2="22"
            y2="6"
            stroke="var(--card-accent, var(--primary))"
            stroke-width="2"
            stroke-dasharray="6 22"
          />
          <polygon points="21,2.5 27,6 21,9.5" fill="var(--card-accent, var(--primary))" />
        </svg>
      </span>
    }
  }
</div>
