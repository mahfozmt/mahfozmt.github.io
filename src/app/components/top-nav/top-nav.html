<header class="top-nav">
  <div class="container nav-wrapper">
    <a href="#top" class="brand-logo" [attr.aria-label]="profile.name + ' - Home'">
      <div class="brand-icon">{{ brand.initials }}</div>
      <div class="brand-title">
        <span class="name">{{ profile.name }}</span>
        <span class="title">{{ brand.tagline }}</span>
      </div>
    </a>

    <!-- Desktop Navigation Links -->
    <nav class="desktop-nav" aria-label="Primary navigation">
      @for (link of links; track link.id) {
        <a [href]="'#' + link.id" [class.active]="activeSection() === link.id">{{ link.label }}</a>
      }
    </nav>

    <!-- Action items -->
    <div class="nav-actions">
      <button
        id="themeToggleBtn"
        class="btn-icon theme-toggle-btn"
        type="button"
        aria-label="Toggle color theme"
        title="Toggle theme"
        (click)="themeService.toggle()"
      >
        <!-- Sun icon in dark mode, moon icon in light mode -->
        <svg
          id="themeIcon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          @if (themeService.theme() === 'dark') {
            <circle cx="12" cy="12" r="5" />
            <line x1="12" y1="1" x2="12" y2="3" />
            <line x1="12" y1="21" x2="12" y2="23" />
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
            <line x1="1" y1="12" x2="3" y2="12" />
            <line x1="21" y1="12" x2="23" y2="12" />
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
          } @else {
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
          }
        </svg>
      </button>

      <a
        [href]="profile.cvFile"
        class="btn btn-primary btn-sm"
        [attr.download]="profile.cvDownloadName"
        title="Download Resume PDF"
        aria-label="Download CV"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
          <path d="M7 10l5 5 5-5" />
          <path d="M12 15V3" />
        </svg>
        <span>CV</span>
      </a>

      <button
        id="mobileMenuBtn"
        class="btn-icon mobile-menu-toggle"
        type="button"
        aria-label="Open mobile menu"
        aria-controls="mobileDrawer"
        [attr.aria-expanded]="menuOpen()"
        (click)="toggleMenu()"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          [attr.stroke-linecap]="menuOpen() ? null : 'round'"
          [attr.stroke-linejoin]="menuOpen() ? null : 'round'"
          aria-hidden="true"
        >
          @if (menuOpen()) {
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          } @else {
            <line x1="3" y1="12" x2="21" y2="12" />
            <line x1="3" y1="6" x2="21" y2="6" />
            <line x1="3" y1="18" x2="21" y2="18" />
          }
        </svg>
      </button>
    </div>
  </div>

  <!-- Mobile Drawer Navigation -->
  <div
    id="mobileDrawer"
    class="mobile-nav-drawer"
    [class.open]="menuOpen()"
    aria-label="Mobile navigation"
  >
    @for (link of links; track link.id) {
      <a [href]="'#' + link.id" class="mobile-link" (click)="closeMenu()">{{ link.mobileLabel }}</a>
    }
    <div class="mobile-actions">
      <a [href]="profile.cvFile" class="btn btn-primary" [attr.download]="profile.cvDownloadName">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
          <path d="M7 10l5 5 5-5" />
          <path d="M12 15V3" />
        </svg>
        Download CV (PDF)
      </a>
    </div>
  </div>
</header>
