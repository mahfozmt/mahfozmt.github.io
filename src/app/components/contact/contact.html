<section id="contact" class="section" [attr.aria-labelledby]="contact.headingId">
  <div class="container">
    <div class="cta-card">
      <div class="cta-content">
        <div class="status-badge" style="margin-bottom: 14px">
          <span class="pulse-dot"></span>
          <span>{{ contact.statusText }}</span>
        </div>
        <h2 [id]="contact.headingId">{{ contact.heading }}</h2>
        <p>{{ contact.paragraph }}</p>
        <div class="hero-actions">
          <a [href]="'mailto:' + profile.email" class="btn btn-primary">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="m22 7-10 6L2 7" />
              <rect x="2" y="4" width="20" height="16" rx="2" />
            </svg>
            {{ contact.emailButtonLabel }}
          </a>
          <button
            id="copyEmailCtaBtn"
            class="btn"
            type="button"
            [appCopyEmail]="profile.email"
            [attr.data-email]="profile.email"
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2" />
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
            </svg>
            {{ contact.copyButtonLabel }}
          </button>
        </div>
      </div>

      <div class="contact-fast-links">
        @for (row of contact.links; track row.label) {
          <a
            [href]="row.href"
            class="contact-link-row"
            [attr.target]="row.external ? '_blank' : null"
            [attr.rel]="row.external ? 'noopener' : null"
            [attr.download]="row.download ?? null"
          >
            <div class="contact-info">
              @switch (row.icon) {
                @case ('mail') {
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="m22 7-10 6L2 7" />
                    <rect x="2" y="4" width="20" height="16" rx="2" />
                  </svg>
                }
                @case ('linkedin') {
                  <svg viewBox="0 0 24 24" fill="currentColor">
                    <path
                      d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 1 1 0-4.13 2.06 2.06 0 0 1 0 4.13zM7.12 20.45H3.56V9h3.56v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.73v20.54C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.73V1.73C24 .77 23.2 0 22.22 0z"
                    />
                  </svg>
                }
                @case ('github') {
                  <svg viewBox="0 0 24 24" fill="currentColor">
                    <path
                      d="M12 .3a12 12 0 0 0-3.8 23.38c.6.12.83-.26.83-.57v-2.04c-3.34.73-4.04-1.61-4.04-1.61-.55-1.39-1.34-1.76-1.34-1.76-1.09-.75.08-.73.08-.73 1.2.08 1.84 1.24 1.84 1.24 1.07 1.83 2.81 1.3 3.5 1 .1-.78.42-1.31.76-1.61-2.67-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.13-.3-.54-1.52.12-3.18 0 0 1-.32 3.3 1.23a11.5 11.5 0 0 1 6 0c2.28-1.55 3.29-1.23 3.29-1.23.66 1.66.25 2.88.12 3.18.77.84 1.24 1.91 1.24 3.22 0 4.61-2.81 5.62-5.48 5.92.43.37.81 1.1.81 2.22v3.29c0 .32.22.69.83.57A12 12 0 0 0 12 .3"
                    />
                  </svg>
                }
                @case ('download') {
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                    <path d="M7 10l5 5 5-5" />
                    <path d="M12 15V3" />
                  </svg>
                }
              }
              <span>{{ row.label }}</span>
            </div>
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <polyline points="9 18 15 12 9 6" />
            </svg>
          </a>
        }
      </div>
    </div>
  </div>
</section>
